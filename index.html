<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setlist"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Setlist</title>
<meta name="theme-color" content="#0e0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f2f7;--card:#fff;--tx:#16141c;--mut:#6d6a78;--ac:#e8541e;--ln:#e3e0ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d12;--card:#1a1822;--tx:#f3f1f8;--mut:#9a96a8;--ln:#2a2733;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d12;--card:#1a1822;--tx:#f3f1f8;--mut:#9a96a8;--ln:#2a2733;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1{font-size:30px;margin:8px 0 12px;letter-spacing:-.5px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 8px}
.card{display:flex;gap:12px;background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;cursor:pointer;border:1px solid var(--ln)}
.th{width:88px;min-height:88px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;flex:none}
.cb{padding:10px 12px 10px 0;min-width:0;flex:1}.cb b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:14px}.st{color:var(--ac);letter-spacing:2px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;color:#fff;margin-top:4px}
.s-interested{background:#8a8796}.s-planned{background:#3b7bf0}.s-ticketed{background:#25a35a}.s-attended{background:var(--ac)}.s-missed{background:#b04040}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mut);font-weight:600}textarea{min-height:80px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:#d33}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mut);padding:4px;cursor:pointer}nav a i{display:block;font-style:normal;font-size:22px}nav a.on{color:var(--ac)}
nav a.plus i{background:var(--ac);color:#fff;width:46px;height:34px;line-height:34px;border-radius:12px;margin:0 auto}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.hero{height:220px;background-size:cover;background-position:center;border-radius:0 0 22px 22px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.bar{height:10px;border-radius:5px;background:var(--ac)}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}.stat b{font-size:26px;display:block}
.stars span{font-size:30px;color:var(--ln);cursor:pointer}.stars span.on{color:var(--ac)}
.ai{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.top button{padding:8px 12px}
.cnt{background:var(--ac);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:4px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:6px}.seg button{flex:1;background:none;color:var(--mut);padding:8px}.seg button.on{background:var(--ac);color:#fff}
a{color:var(--ac)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
</style></head><body>
<main id="app"></main><div id="sheet"></div>
<nav><a data-t="a"><i>🎫</i>Archiv</a><a data-t="u"><i>📅</i>Geplant</a><a class="plus" data-t="q"><i>＋</i>Neu</a><a data-t="s"><i>📊</i>Statistik</a></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ST={interested:'Interesse',planned:'Geplant',ticketed:'Ticket vorhanden',attended:'Besucht',missed:'Verpasst'};
let S=[];
let tab='a',q='',draft=null,sm='date';try{sm=localStorage.getItem('sl1sort')||'date'}catch(e){}
function newC(st,b){const t=new Date(),iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');edit(null,{id:uid(),artist:'',date:st=='attended'?iso:'',venue:'',city:'',country:'',tour:'',status:st,rating:0,notes:'',photos:[],links:[],ticket:'',genre:'',origin:'',info:'',...b,isNew:1})}
function sameEv(id){const c=S.find(x=>x.id==id);newC('attended',{date:c.date,venue:c.venue,city:c.city,country:c.country,tour:c.tour,notes:/^Festival-Zeitraum/.test(c.notes||'')?c.notes:''})}
function setSm(m){sm=m;try{localStorage.setItem('sl1sort',m)}catch(e){}render()}
/* ---- Datenspeicher: IndexedDB (Fallback: localStorage) ---- */
let db=null,sig=new Map(),meta={},sq=Promise.resolve();
const idb=(n,m,f)=>new Promise((res,rej)=>{const tx=db.transaction(n,m),r=f(tx.objectStore(n));tx.oncomplete=()=>res(r&&r.result);tx.onerror=tx.onabort=()=>rej(tx.error)});
const openDB=()=>new Promise((res,rej)=>{const q=indexedDB.open('setlist',1);q.onupgradeneeded=e=>{const d=q.result;if(e.oldVersion<1){d.createObjectStore('concerts',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'})}/* Zukunft: if(e.oldVersion<2){ ...neue Stores/Felder ergänzen, bestehende Daten bleiben erhalten... } */};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const flag=k=>meta[k]||localStorage.getItem(k);
const setFlag=k=>{meta[k]=1;try{localStorage.setItem(k,'1')}catch(e){}if(db)idb('meta','readwrite',st=>st.put({k,v:1})).catch(()=>{})};
async function flush(){if(!db){try{localStorage.setItem('sl1',JSON.stringify(S))}catch(e){alert('Speicher voll. Bitte Backup exportieren.')}return}
const ch=[],now=new Map();S.forEach(c=>{const s=JSON.stringify(c);now.set(c.id,s);if(sig.get(c.id)!==s)ch.push(c)});const del=[...sig.keys()].filter(k=>!now.has(k));
if(!ch.length&&!del.length)return;await idb('concerts','readwrite',st=>{ch.forEach(c=>st.put(c));del.forEach(k=>st.delete(k))});sig=now}
const save=()=>{sq=sq.then(flush).catch(e=>alert('Speichern fehlgeschlagen: '+(e&&e.message||e)));return true};
async function boot(){try{db=await openDB();(await idb('meta','readonly',st=>st.getAll())).forEach(x=>meta[x.k]=x.v);S=await idb('concerts','readonly',st=>st.getAll());sig=new Map(S.map(c=>[c.id,JSON.stringify(c)]));
if(!S.length&&!meta.migrated){try{const a=JSON.parse(localStorage.getItem('sl1')||'[]');if(Array.isArray(a))S=a}catch(e){}}
meta.migrated=1;idb('meta','readwrite',st=>st.put({k:'migrated',v:1})).catch(()=>{})}
catch(e){db=null;try{S=JSON.parse(localStorage.getItem('sl1')||'[]')}catch(e2){S=[]}}
seedOnce();save();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nk=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüßá]/g,'');
const SEED=[];
function seedOnce(){try{if(!flag('sl2seed')){const keep=[],mod=new Set();let n=0;
S.forEach(c=>{if(/^seed\d+$/.test(c.id)){if(c.rating||(c.photos&&c.photos.length)||(c.links&&c.links.length)||c.ticket||c.genre||c.info){keep.push(c);mod.add(nk(c.artist)+c.date)}}else keep.push(c)});
S=keep;
SEED.forEach(e=>e.b.forEach(x=>{const a=Array.isArray(x)?x[0]:x,bn=Array.isArray(x)?x[1]:'';if(mod.has(nk(a)+e.d))return;S.push({id:'v2_'+(++n),artist:a,date:e.d,venue:e.v,city:e.c,country:e.l,tour:e.t||'',status:'attended',rating:0,notes:[e.n,bn].filter(Boolean).join(' · '),photos:[],links:[],ticket:'',genre:'',origin:'',info:''})}));
setFlag('sl2seed');save()}}catch(e){}}
let cm={};const recount=()=>{cm={};S.forEach(c=>{if(c.status=='attended'){const k=nk(c.artist);cm[k]=(cm[k]||0)+1}})};
const bdg=c=>c.status=='attended'&&cm[nk(c.artist)]>1?` <span class="cnt">${cm[nk(c.artist)]}×</span>`:'';
const hue=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const bg=c=>c.photos?.[0]?`background-image:url(${c.photos[0]})`:`background:linear-gradient(135deg,hsl(${hue(c.genre||c.artist)},65%,45%),hsl(${(hue(c.genre||c.artist)+50)%360},70%,30%))`;
const fmt=d=>{if(!d)return'Datum offen';const p=d.split('-');const o={3:{day:'2-digit',month:'long',year:'numeric'},2:{month:'long',year:'numeric'},1:{year:'numeric'}}[p.length];return new Date(d.length==4?d+'-01-01':d.length==7?d+'-01':d).toLocaleDateString('de-DE',o)};
const days=d=>{if(!d||d.length!=10)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d)-t)/864e5)};
const stars=r=>r?'★'.repeat(r)+'☆'.repeat(5-r):'';
const key=d=>d||'9999';
function card(c){const n=days(c.date),cd=c.status!='attended'&&n!=null?(n>=0?`in ${n} Tagen`:'vorbei'):'';
return`<div class="card" onclick="detail('${c.id}')"><div class="th" style="${bg(c)}">${c.photos?.[0]?'':esc(c.artist.slice(0,2).toUpperCase())}</div><div class="cb"><b>${esc(c.artist)}</b><div class="mut">${fmt(c.date)}${bdg(c)}</div><div class="mut">${esc([c.venue,c.city,c.country].filter(Boolean).join(', '))}</div>${c.status=='attended'?`<span class="st">${stars(c.rating)}</span>`:`<span class="chip s-${c.status}">${ST[c.status]}</span> <span class="mut">${cd}</span>`}</div></div>`}
function render(){recount();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==tab));
let h='';
if(tab=='a'||tab=='u'){const past=tab=='a',ql=q.toLowerCase();
let L=S.filter(c=>past==(c.status=='attended')).filter(c=>!ql||c.artist.toLowerCase().includes(ql));
const az=sm=='az';L.sort((a,b)=>az?(a.artist.trim().localeCompare(b.artist.trim(),'de',{sensitivity:'base'})||key(b.date).localeCompare(key(a.date))):past?key(b.date).localeCompare(key(a.date)):key(a.date).localeCompare(key(b.date)));
const md=past&&sm=='cnt'?'cnt':sm=='az'?'az':'date',cm2=md=='cnt';if(cm2){const m={};L.forEach(c=>{const k=nk(c.artist);if(!m[k]||key(c.date)>key(m[k].date))m[k]=c});L=Object.values(m).sort((a,b)=>cm[nk(b.artist)]-cm[nk(a.artist)]||a.artist.localeCompare(b.artist,'de',{sensitivity:'base'}))}
h=`<div class="top"><h1 style="margin:0">${past?'Archiv':'Geplant'}</h1><button onclick="newC('${past?'attended':'planned'}')">＋ Hinzufügen</button></div><input id="qs" type="search" placeholder="Band suchen…" value="${esc(q)}" oninput="q=this.value;render();const e=$('#qs');e.focus();e.setSelectionRange(99,99)"><div class="seg"><button class="${md=='date'?'on':''}" onclick="setSm('date')">Datum</button><button class="${md=='az'?'on':''}" onclick="setSm('az')">A–Z</button>${past?`<button class="${cm2?'on':''}" onclick="setSm('cnt')">Meist gesehen</button>`:''}</div>`;
if(!L.length)h+=`<div class="empty">${past?'Noch keine besuchten Konzerte.':'Keine geplanten Konzerte.'}<br>Tippe auf ＋ um eines hinzuzufügen.</div>`;
let y='';L.forEach(c=>{const yy=cm2?cm[nk(c.artist)]+'× gesehen':az?(/^[A-ZÄÖÜ]/i.test(c.artist.trim())?c.artist.trim()[0].toUpperCase():'#'):past?(c.date||'').slice(0,4)||'Ohne Datum':ST[c.status];if(yy!=y){y=yy;h+=`<h2>${yy}</h2>`}h+=card(c)})}
else if(tab=='q'){h=`<h1>Neues Konzert</h1><label>Kurz beschreiben (KI erkennt die Felder)</label><textarea id="qt" placeholder="z. B. Iron Maiden Hamburg Juni 2026"></textarea><div class="row"><button id="qb" onclick="aiAdd()">✨ Erkennen</button><button class="g" onclick="newC('attended')">Besucht eintragen</button><button class="g" onclick="newC('planned')">Geplant eintragen</button></div><div id="qm" class="mut"></div>`}
else h=stats();
$('#app').innerHTML=h}
function stats(){const A=S.filter(c=>c.status=='attended');if(!A.length)return`<h1>Statistik</h1><div class="empty">Noch keine Daten.</div>`;
const cnt=f=>{const m={};A.forEach(c=>{const k=f(c);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const R=A.filter(c=>c.rating),avg=R.length?(R.reduce((a,c)=>a+c.rating,0)/R.length).toFixed(1):'–';
const yr=cnt(c=>(c.date||'').slice(0,4)).sort((a,b)=>a[0]-b[0]),mx=Math.max(...yr.map(x=>x[1]),1),nm0={},top=(A.forEach(c=>nm0[nk(c.artist)]=c.artist),Object.entries(cm).sort((a,b)=>b[1]-a[1]||nm0[a[0]].localeCompare(nm0[b[0]])).slice(0,15).map(([k,n])=>[nm0[k],n]));
return`<h1>Statistik</h1><div class="stat"><div><b>${new Set(A.map(c=>c.date+c.venue)).size}</b>Events</div><div><b>${A.length}</b>Auftritte</div><div><b>${Object.keys(cm).length}</b>Bands</div><div><b>${cnt(c=>c.country).length}</b>Länder</div><div><b>${avg}</b>Ø Bewertung</div></div>
<h2>Pro Jahr</h2>${yr.map(([y,n])=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span class="mut" style="width:42px">${y}</span><div class="bar" style="width:${n/mx*100}%"></div><span>${n}</span></div>`).join('')}
<h2>Meistgesehen (Top 15)</h2>${top.map(([a,n])=>`<div class="top"><span>${esc(a)}</span><b>${n}×</b></div>`).join('')}
<h2>Städte</h2><div class="mut">${cnt(c=>c.city).slice(0,12).map(([a,n])=>esc(a)+' ('+n+')').join(' · ')}</div>
<h2>Backup</h2><p class="mut">Alle Daten liegen nur auf diesem Gerät. Exportiere sie regelmäßig als Sicherung.</p><div class="row"><button class="g" onclick="exp()">Exportieren</button><button class="g" onclick="$('#imp').click()">Importieren</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])">`}
function sheet(h){const s=$('#sheet');s.innerHTML=`<main>${h}</main>`;s.style.display='block';s.scrollTop=0}
function close_(){$('#sheet').style.display='none';render()}
function detail(id){recount();const c=S.find(x=>x.id==id);if(!c)return;const A=S.filter(x=>x.status=='attended'&&nk(x.artist)==nk(c.artist)).sort((a,b)=>key(b.date).localeCompare(key(a.date))),n=A.length;
const L=(c.links||[]).map(l=>`<div><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title||l.url)}</a></div>`).join('');
sheet(`<div class="top"><button class="g" onclick="close_()">‹ Zurück</button><button class="g" onclick="edit('${id}')">Bearbeiten</button></div>
<div class="hero" style="${bg(c)}"></div><h1>${esc(c.artist)}</h1>
<div><span class="chip s-${c.status}">${ST[c.status]}</span> ${c.status=='attended'?`<span class="st">${stars(c.rating)}</span>`:''}</div>
<p>📅 ${fmt(c.date)}<br>📍 ${esc([c.venue,c.city,c.country].filter(Boolean).join(', '))||'–'}${c.tour?`<br>🎤 ${esc(c.tour)}`:''}</p>
${n>1?`<div class="ai">Du hast ${esc(c.artist)} <b>${n}×</b> gesehen.</div>`+A.map(x=>`<div class="mut" onclick="detail('${x.id}')" style="padding:6px 0;cursor:pointer;${x.id==c.id?'font-weight:700;color:var(--tx)':''}">${fmt(x.date)} · ${esc([x.venue,x.city].filter(Boolean).join(', '))}</div>`).join(''):''}
${c.genre||c.origin||c.info?`<h2>Über den Künstler</h2><div>${esc([c.genre,c.origin].filter(Boolean).join(' · '))}</div><div class="mut">${esc(c.info||'')}</div>`:''}
${c.notes?`<h2>Notizen</h2><div style="white-space:pre-wrap">${esc(c.notes)}</div>`:''}
${c.ticket?`<h2>Ticket</h2><a href="${esc(c.ticket)}" target="_blank" rel="noopener">Ticket-/Veranstaltungslink</a>`:''}
${L?`<h2>Links</h2>${L}`:''}
${c.photos?.length?`<h2>Fotos</h2><div class="gal">${c.photos.map((p,i)=>`<img src="${p}" onclick="big('${id}',${i})">`).join('')}</div>`:''}
<div class="row"><button class="g" onclick="sameEv('${id}')">＋ Weitere Band vom selben Event</button>${c.status!='attended'?`<button onclick="mark('${id}')">✓ Als besucht markieren</button>`:''}<button class="d" onclick="del('${id}')">Löschen</button></div>`)}
function big(id,i){const c=S.find(x=>x.id==id);const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000e;z-index:50;display:flex;align-items:center;justify-content:center';o.innerHTML=`<img src="${c.photos[i]}" style="max-width:100%;max-height:100%">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
function mark(id){const c=S.find(x=>x.id==id);c.status='attended';save();edit(id)}
function del(id){if(confirm('Eintrag wirklich löschen?')){S=S.filter(x=>x.id!=id);save();close_()}}
let cur=null;
function edit(id,d){cur=d||(id?JSON.parse(JSON.stringify(S.find(x=>x.id==id))):{id:uid(),artist:'',date:'',venue:'',city:'',country:'',tour:'',status:'planned',rating:0,notes:'',photos:[],links:[],ticket:'',genre:'',origin:'',info:'',isNew:1});
const c=cur,f=(k,l,t='text',p='')=>`<label>${l}</label><input id="f_${k}" type="${t}" value="${esc(c[k])}" placeholder="${p}">`;
sheet(`<div class="top"><button class="g" onclick="close_()">Abbrechen</button><button onclick="commit()">Sichern</button></div><h1>${c.isNew?'Neues Konzert':'Bearbeiten'}</h1>
${c.ai?`<div class="ai">✨ KI-Vorschlag – bitte prüfen. Leere Felder waren unklar, nichts wurde geraten.${c.conf!=null?` (Sicherheit ${Math.round(c.conf*100)} %)`:''}</div>`:''}
${f('artist','Band / Künstler')}${f('date','Datum (JJJJ-MM-TT, oder nur JJJJ-MM bzw. JJJJ)','text','2026-06-20')}${f('venue','Veranstaltungsort')}${f('city','Stadt')}${f('country','Land')}${f('tour','Tour / Veranstaltung')}
<label>Status</label><select id="f_status" onchange="cur.status=this.value;sync();edit2()">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${c.status==k?'selected':''}>${v}</option>`).join('')}</select>
${c.status=='attended'?`<label>Bewertung</label><div class="stars" id="rt">${[1,2,3,4,5].map(i=>`<span class="${i<=c.rating?'on':''}" onclick="cur.rating=cur.rating==${i}?0:${i};sync();edit2()">★</span>`).join('')}</div>`:''}
${f('ticket','Ticket- / Veranstaltungslink','url','https://…')}
<label>Notizen & Erinnerungen</label><textarea id="f_notes">${esc(c.notes)}</textarea>
<h2>Künstler-Infos</h2>${f('genre','Genre')}${f('origin','Herkunft')}<label>Info</label><textarea id="f_info">${esc(c.info)}</textarea>
<label>Weitere Links (je Zeile: Titel | URL)</label><textarea id="f_links">${esc((c.links||[]).map(l=>l.title+' | '+l.url).join('\n'))}</textarea>
<h2>Fotos</h2><div class="gal">${(c.photos||[]).map((p,i)=>`<div style="position:relative"><img src="${p}"><button class="d" style="position:absolute;top:2px;right:2px;padding:2px 8px;background:#000a;color:#fff" onclick="sync();cur.photos.splice(${i},1);edit2()">✕</button></div>`).join('')}</div>
<div class="row"><button class="g" onclick="$('#ph').click()">📷 Fotos hinzufügen</button></div><input id="ph" type="file" accept="image/*" multiple hidden onchange="addPh(this.files)">`)}
const edit2=()=>edit(null,cur);
function sync(){['artist','date','venue','city','country','tour','ticket','notes','genre','origin','info'].forEach(k=>{const e=$('#f_'+k);if(e)cur[k]=e.value.trim()});const l=$('#f_links');if(l)cur.links=l.value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split('|');return p.length>1?{title:p[0].trim(),url:p.slice(1).join('|').trim()}:{title:'',url:s}})}
function addPh(fs){sync();let n=fs.length;[...fs].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cur.photos.push(cv.toDataURL('image/jpeg',.7));if(!--n)edit2()};im.src=r.result};r.readAsDataURL(f)})}
function commit(){sync();if(!cur.artist){alert('Bitte einen Künstler eingeben.');return}if(!/^\d{4}(-\d{2}(-\d{2})?)?$/.test(cur.date||'')&&cur.date){alert('Datum bitte als JJJJ-MM-TT, JJJJ-MM oder JJJJ.');return}
if(cur.status!='attended')cur.rating=0;const i=S.findIndex(x=>x.id==cur.id);const o={...cur};delete o.isNew;delete o.ai;delete o.conf;i<0?S.push(o):S[i]=o;if(save()){tab=o.status=='attended'?'a':'u';close_()}}
async function aiAdd(){const t=$('#qt').value.trim();if(!t)return;const m=$('#qm');m.textContent='Erkenne…';
try{const sm=window.claude&&await claude.use('sample');if(!sm)throw 0;
const today=new Date().toISOString().slice(0,10);
const r=await sm.json(`Wandle diese Kurzeingabe in ein Konzert um. Heute ist ${today}. Antworte NUR mit JSON: {"artist":string,"date":"JJJJ-MM-TT"|"JJJJ-MM"|"JJJJ"|"","venue":string,"city":string,"country":string,"tour":string,"genre":string,"origin":string,"info":string (max 2 Sätze),"status":"attended"|"planned","confidence":0-1}. Datum nur so genau wie angegeben. Unbekanntes oder Unsicheres = "" (nichts erfinden). Liegt das Datum in der Vergangenheit: attended, sonst planned. Land als deutscher Name.\nEingabe: ${t}`,{modelTier:'quick'});
edit(null,{id:uid(),artist:'',date:'',venue:'',city:'',country:'',tour:'',status:'planned',rating:0,notes:'',photos:[],links:[],ticket:'',genre:'',origin:'',info:'',...r,conf:r.confidence,ai:1,isNew:1})}
catch(e){m.textContent='KI nicht verfügbar – bitte manuell eingeben.';edit(null,{id:uid(),artist:t,date:'',venue:'',city:'',country:'',tour:'',status:'planned',rating:0,notes:'',photos:[],links:[],ticket:'',genre:'',origin:'',info:'',isNew:1})}}
async function exp(){const f=new File([JSON.stringify(S)],'setlist-backup-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Setlist Backup'});return}}catch(e){if(e&&e.name=='AbortError')return}
try{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){alert('Export nicht möglich.')}}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(Array.isArray(a)&&confirm(a.length+' Einträge importieren und aktuelle Daten ersetzen?')){S=a;save();render()}}catch(e){alert('Ungültige Datei.')}};r.readAsText(f)}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{tab=a.dataset.t;q='';render();scrollTo(0,0)});
boot();
</script></body></html>
